# Managed centrally. Grouped updates keep PR volume low.
# open-pull-requests-limit: 0 disables routine version PRs but
# Dependabot SECURITY updates are still delivered.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
